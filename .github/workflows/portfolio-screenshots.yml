name: Capturas reales del portafolio
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-screenshots.yml"
      - "scripts/capture-portfolio.cjs"
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador para capturas reales
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturar las páginas con Chromium
        run: node scripts/capture-portfolio.cjs
      - name: Publicar PNG en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: capturas reales del portafolio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
